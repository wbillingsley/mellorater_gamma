# HAProxy as the TLS-terminating front door for animalwellbeing.
#
# The server itself now serves the built client (see Main.scala's /mellorater-alpha route) as
# well as the /api/* endpoints, so there's a single backend -- haproxy's only job is TLS
# termination and forwarding to it.
#
# Install:
#   sudo dnf install haproxy
#   sudo cp deploy/haproxy.cfg /etc/haproxy/haproxy.cfg
#   sudo vi /etc/haproxy/haproxy.cfg   # set your real domain in the ACL below if you add one
#   # combine your cert chain + key into the single PEM haproxy expects:
#   sudo mkdir -p /etc/haproxy/certs
#   sudo bash -c 'cat /etc/letsencrypt/live/example.com/fullchain.pem \
#                     /etc/letsencrypt/live/example.com/privkey.pem \
#                     > /etc/haproxy/certs/animalwellbeing.pem'
#   sudo chmod 600 /etc/haproxy/certs/animalwellbeing.pem
#   sudo setsebool -P haproxy_connect_any 1   # SELinux: allow haproxy -> localhost:8081 (non-standard port)
#   sudo systemctl enable --now haproxy
#
# Getting the initial certificate (haproxy can't do the ACME HTTP-01 challenge itself):
#   sudo systemctl stop haproxy
#   sudo dnf install certbot
#   sudo certbot certonly --standalone -d example.com
#   sudo systemctl start haproxy
# (then re-run the `cat ... > animalwellbeing.pem` step above and reload haproxy; certbot's
# renewal hook should do the same cat+reload automatically -- see certbot's deploy-hook option)

global
    log /dev/log local0
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    # Long enough for an AI feedback request: Claude thinks before replying, and if it fails the
    # server retries on Groq within the same request.
    timeout server  150s

frontend fe_http
    bind *:80
    redirect scheme https code 301 if !{ ssl_fc }

frontend fe_https
    bind *:443 ssl crt /etc/haproxy/certs/animalwellbeing.pem
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend be_awserver

backend be_awserver
    server aw1 127.0.0.1:8081 check
